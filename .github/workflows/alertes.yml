name: Surveillance des alertes

on:
  schedule:
    - cron: "*/5 * * * *"    # toutes les 5 min (GitHub peut prendre 5 a 15 min de retard)
  workflow_dispatch: {}

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python cloud/watch.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          CHAT_CHANNEL_ID: ${{ secrets.CHAT_CHANNEL_ID }}
          ALERT_CHANNEL_ID: ${{ secrets.ALERT_CHANNEL_ID }}
